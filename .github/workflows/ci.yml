name: CI

on:
  push:
    branches: [main]
    # Un tag vX.Y (la version de project.godot) publie une Release avec les trois jeux (job release)
    tags: ["v*"]
  pull_request:

env:
  GODOT_VERSION: 4.7.2

jobs:
  test-et-export:
    name: Tests + exports Web, Windows, Linux et macOS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Installer Godot et les templates d'export
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSLO "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -sSLO "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -d /tmp/templates
          mv /tmp/templates/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          godot --version

      - name: Importer les ressources
        run: godot --headless --import . || true

      - name: Tests unitaires
        shell: bash
        run: |
          set -o pipefail
          timeout 300 godot --headless --script tests/unitaires.gd 2>&1 | tee unitaires.log
          if grep -nE "SCRIPT ERROR|SHADER ERROR" unitaires.log; then echo "::error::erreur de script dans les tests unitaires"; exit 1; fi

      - name: Smoke test
        shell: bash
        run: |
          set -o pipefail
          timeout 300 godot --headless --script tests/smoke_test.gd 2>&1 | tee smoke_test.log
          if grep -nE "SCRIPT ERROR|SHADER ERROR" smoke_test.log; then echo "::error::erreur de script dans le smoke test"; exit 1; fi

      - name: Test de la bataille locale
        shell: bash
        run: |
          set -o pipefail
          timeout 300 godot --headless --fixed-fps 60 --script tests/bataille_test.gd 2>&1 | tee bataille_test.log
          if grep -nE "SCRIPT ERROR|SHADER ERROR" bataille_test.log; then echo "::error::erreur de script dans le test de bataille"; exit 1; fi

      - name: Banc de la prédiction (latence simulée, un seul processus)
        shell: bash
        run: |
          set -o pipefail
          timeout 300 godot --headless --fixed-fps 60 --script tests/prediction_test.gd 2>&1 | tee prediction_test.log
          if grep -nE "SCRIPT ERROR|SHADER ERROR" prediction_test.log; then echo "::error::erreur de script dans le banc de la prédiction"; exit 1; fi

      - name: Test réseau (plusieurs processus sur localhost, dont une manche sous latence simulée et la découverte en vraie diffusion)
        shell: bash
        run: |
          set -o pipefail
          DIFFUSION=1 timeout 300 bash tests/reseau/lancer.sh 2>&1 | tee reseau.log
          if grep -nE "SCRIPT ERROR|SHADER ERROR" reseau.log; then echo "::error::erreur de script dans le test réseau"; exit 1; fi

      - name: Captures (déroulé sans rendu, les scripts de captures gardés en vie)
        shell: bash
        run: |
          set -o pipefail
          D="$(mktemp -d)"
          timeout 180 godot --headless --script tests/screenshots.gd -- --dossier="$D" 2>&1 | tee captures.log
          timeout 120 godot --headless --script tests/deux_fenetres.gd -- --role=client --dossier="$D" > deux_fenetres_client.log 2>&1 &
          CLIENT=$!
          statut_hote=0
          timeout 120 godot --headless --script tests/deux_fenetres.gd -- --role=hote --dossier="$D" 2>&1 | tee deux_fenetres_hote.log || statut_hote=$?
          statut_client=0
          wait "$CLIENT" || statut_client=$?
          cat deux_fenetres_client.log
          if [ "$statut_hote" -ne 0 ] || [ "$statut_client" -ne 0 ]; then
            echo "::error::tests/deux_fenetres.gd a échoué (hôte $statut_hote, client $statut_client)"; exit 1
          fi
          if grep -nE "SCRIPT ERROR|SHADER ERROR|❌" captures.log deux_fenetres_hote.log deux_fenetres_client.log; then echo "::error::erreur dans un script de captures"; exit 1; fi
          [ "$(grep -c "📸" captures.log)" -eq 37 ] || { echo "::error::tests/screenshots.gd n'a pas déroulé ses 37 captures"; exit 1; }
          [ "$(grep -c "📸" deux_fenetres_hote.log)" -eq 5 ] && [ "$(grep -c "📸" deux_fenetres_client.log)" -eq 6 ] \
            || { echo "::error::tests/deux_fenetres.gd n'a pas déroulé ses captures (5 pour l'hôte, 6 pour le client)"; exit 1; }

      - name: Exporter en Web
        shell: bash
        run: |
          mkdir -p export/web
          timeout 600 godot --headless --export-release Web export/web/index.html
          test -f export/web/index.html

      - name: Exporter pour Windows
        shell: bash
        run: |
          mkdir -p export/windows
          timeout 600 godot --headless --export-release "Windows Desktop" export/windows/LeLion-multi.exe
          test -s export/windows/LeLion-multi.exe
          ls -l export/windows

      - name: Vérifier l'icône et les métadonnées de l'exécutable Windows
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq icoutils > /dev/null
          EXE=export/windows/LeLion-multi.exe
          MODELE="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/windows_release_x86_64.exe"
          test -s "$MODELE" || { echo "::error::le modèle de template Windows est vide ou introuvable"; exit 1; }
          VERSION="$(sed -n 's/^config\/version="\(.*\)"$/\1/p' project.godot)"
          # `config/version` peut avoir deux ou trois nombres ("0.19" ou "0.19.1") ; la ressource
          # de version en veut quatre : on complète par des zéros avant de chercher la chaîne.
          VERSION4="$VERSION"
          N="$(awk -F. '{print NF}' <<< "$VERSION")"
          while [ "$N" -lt 4 ]; do VERSION4="${VERSION4}.0"; N=$((N + 1)); done
          # Les chaînes de la ressource de version (UTF-16) : le nom que montrent l'explorateur et la
          # fenêtre du pare-feu, la version du jeu sur quatre nombres.
          wrestool -x --raw --type=16 "$EXE" | strings -el > version_exe.txt
          cat version_exe.txt
          grep -qxF "LeLion multi" version_exe.txt || { echo "::error::le nom LeLion multi manque aux métadonnées de l'exe"; exit 1; }
          grep -qxF "$VERSION4" version_exe.txt || { echo "::error::la version $VERSION4 manque aux métadonnées de l'exe"; exit 1; }
          # Icône : les deux extractions vont dans des fichiers, pour qu'un échec de wrestool
          # (icône absente, ressource illisible) ne se traduise pas en une comparaison vide qui
          # passerait à tort.
          wrestool -x --raw --type=3 "$EXE" > icone_exe.bin
          wrestool -x --raw --type=3 "$MODELE" > icone_modele.bin
          test -s icone_exe.bin || { echo "::error::l'extraction de l'icône de l'exe a échoué (fichier vide)"; exit 1; }
          test -s icone_modele.bin || { echo "::error::l'extraction de l'icône du modèle a échoué (fichier vide)"; exit 1; }
          if cmp -s icone_exe.bin icone_modele.bin; then
            echo "::error::l'exe porte encore l'icône de Godot"; exit 1
          fi

      - name: Publier l'exécutable Windows (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: LeLion-multi-windows
          path: export/windows/LeLion-multi.exe
          if-no-files-found: error
          retention-days: 30

      - name: Exporter pour Linux
        shell: bash
        run: |
          mkdir -p export/linux
          timeout 600 godot --headless --export-release Linux export/linux/LeLion-multi.x86_64
          test -s export/linux/LeLion-multi.x86_64
          ls -l export/linux

      - name: Vérifier l'exécutable Linux (il démarre sans rendu et s'arrête seul)
        shell: bash
        run: |
          set -euo pipefail
          file export/linux/LeLion-multi.x86_64 | tee type_linux.txt
          grep -q "ELF 64-bit.*x86-64" type_linux.txt || { echo "::error::l'exécutable Linux n'est pas un ELF x86-64"; exit 1; }
          chmod +x export/linux/LeLion-multi.x86_64
          statut=0
          timeout 120 export/linux/LeLion-multi.x86_64 --headless --quit-after 300 > linux_demarrage.log 2>&1 || statut=$?
          cat linux_demarrage.log
          [ "$statut" -eq 0 ] || { echo "::error::l'exécutable Linux sort en $statut"; exit 1; }
          if grep -nE "SCRIPT ERROR|SHADER ERROR" linux_demarrage.log; then echo "::error::erreur de script au démarrage de l'exécutable Linux"; exit 1; fi
          # Une archive garde le droit d'exécution, que perd un fichier seul (artefact, téléchargement)
          tar -czf export/LeLion-multi-linux.tar.gz -C export/linux LeLion-multi.x86_64

      - name: Publier l'exécutable Linux (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: LeLion-multi-linux
          path: export/LeLion-multi-linux.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Exporter pour macOS
        shell: bash
        run: |
          mkdir -p export/macos
          timeout 600 godot --headless --export-release macOS export/macos/LeLion-multi-macos.zip
          test -s export/macos/LeLion-multi-macos.zip
          ls -l export/macos

      - name: Vérifier l'application macOS (version, réseau local, signature ad hoc, binaire universel)
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^config\/version="\(.*\)"$/\1/p' project.godot)"
          D="$(mktemp -d)"
          unzip -q export/macos/LeLion-multi-macos.zip -d "$D"
          APP="$(find "$D" -maxdepth 2 -name "*.app" -type d | head -1)"
          test -n "$APP" || { echo "::error::aucune application .app dans le zip macOS"; exit 1; }
          echo "application : $(basename "$APP")"
          python3 - "$APP/Contents/Info.plist" "$VERSION" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], "rb") as f:
              p = plistlib.load(f)
          for cle in ("CFBundleName", "CFBundleIdentifier", "CFBundleShortVersionString", "CFBundleVersion", "NSLocalNetworkUsageDescription"):
              print(f"{cle} = {p.get(cle)}")
          erreurs = []
          if p.get("CFBundleShortVersionString") != sys.argv[2]:
              erreurs.append(f"version {p.get('CFBundleShortVersionString')} au lieu de {sys.argv[2]}")
          if p.get("CFBundleIdentifier") != "org.w3cdotorg.lelion-multi":
              erreurs.append("identifiant de l'application inattendu")
          if not p.get("NSLocalNetworkUsageDescription"):
              erreurs.append("pas de NSLocalNetworkUsageDescription (macOS refuserait la découverte des parties)")
          for e in erreurs:
              print(f"::error::Info.plist : {e}")
          sys.exit(1 if erreurs else 0)
          PY
          test -f "$APP/Contents/_CodeSignature/CodeResources" || { echo "::error::l'application n'est pas signée (ad hoc)"; exit 1; }
          BIN="$(find "$APP/Contents/MacOS" -type f | head -1)"
          file "$BIN" | tee type_macos.txt
          grep -q "Mach-O universal binary with 2 architectures" type_macos.txt || { echo "::error::le binaire macOS n'est pas universel (Intel + Apple Silicon)"; exit 1; }

      - name: Publier l'application macOS (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: LeLion-multi-macos
          path: export/macos/LeLion-multi-macos.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Release (tag vX.Y)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-et-export
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer les trois jeux
        uses: actions/download-artifact@v4
        with:
          path: jeux

      - name: Publier la Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^config\/version="\(.*\)"$/\1/p' project.godot)"
          [ "$GITHUB_REF_NAME" = "v$VERSION" ] || { echo "::error::le tag $GITHUB_REF_NAME ne suit pas la version du jeu ($VERSION) : tag attendu v$VERSION"; exit 1; }
          ls -lR jeux
          cat > notes.md <<NOTES
          LeLion multi $VERSION : la bataille de peinture en réseau local, de 2 à 6 joueurs.

          - **Windows** : \`LeLion-multi.exe\`.
          - **Linux** (x86_64) : \`LeLion-multi-linux.tar.gz\`, à extraire, puis lancer \`LeLion-multi.x86_64\`.
          - **macOS** (Intel et Apple Silicon) : \`LeLion-multi-macos.zip\`, à extraire. L'application n'est pas notarisée : au premier lancement, Réglages Système → Confidentialité et sécurité → « Ouvrir quand même », puis accepter l'accès au réseau local.

          Tout le monde doit avoir la même version. Mise en place et dépannage : section « Jouer en LAN » du README.
          NOTES
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "LeLion multi $VERSION" --notes-file notes.md \
            jeux/LeLion-multi-windows/LeLion-multi.exe \
            jeux/LeLion-multi-linux/LeLion-multi-linux.tar.gz \
            jeux/LeLion-multi-macos/LeLion-multi-macos.zip
